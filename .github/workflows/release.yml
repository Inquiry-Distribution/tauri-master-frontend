name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'latest.json'
      - '**.md'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Upgrade npm to match local toolchain
        run: npm install -g npm@11

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify @tauri-apps/api minor version matches Cargo.lock
        shell: pwsh
        run: |
          $lock = Get-Content "src-tauri/Cargo.lock" -Raw
          $match = [regex]::Match($lock, '(?m)^name = "tauri"\r?\nversion = "([^"]+)"')
          if (-not $match.Success) { Write-Error "tauri not found in Cargo.lock"; exit 1 }
          $rustVer = $match.Groups[1].Value
          $npmVer = (Get-Content "package.json" | ConvertFrom-Json).dependencies."@tauri-apps/api"
          Write-Output "Rust tauri crate : $rustVer"
          Write-Output "npm @tauri-apps/api : $npmVer"
          # tauri-action checks major.minor only (npm doesn't publish every rust patch)
          $rustMinor = ($rustVer -split '\.')[0..1] -join '.'
          $npmMinor  = ($npmVer  -split '\.')[0..1] -join '.'
          if ($rustMinor -ne $npmMinor) {
            Write-Error "Minor version mismatch! rust=$rustVer npm=$npmVer — update package.json '@tauri-apps/api' to a 2.$($rustMinor.Split('.')[1]).x release"
            exit 1
          }
          Write-Output "Minor versions match ($rustMinor) — OK"

      - name: Read version from tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Building version: $v"

      - name: Verify signing key is set
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "TAURI_SIGNING_PRIVATE_KEY secret is EMPTY or not set — updater bundle will not be signed."
            exit 1
          }
          $keyLen = $env:TAURI_SIGNING_PRIVATE_KEY.Trim().Length
          Write-Output "TAURI_SIGNING_PRIVATE_KEY is set (trimmed length: $keyLen chars)"
          if ($keyLen -lt 100) {
            Write-Error "Key looks too short ($keyLen chars) — it may be truncated or incorrect."
            exit 1
          }
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)
          Write-Output "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is $( if ($hasPassword) { 'SET' } else { 'empty (unencrypted key expected)' } )"

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          VITE_PUBLIC_API_URL: ${{ secrets.VITE_PUBLIC_API_URL }}
          VITE_PUBLIC_ASSET_URL: ${{ secrets.VITE_PUBLIC_ASSET_URL }}
        with:
          tagName: v${{ steps.version.outputs.VERSION }}
          releaseName: InquiryHub v${{ steps.version.outputs.VERSION }}
          releaseBody: |
            ## InquiryHub v${{ steps.version.outputs.VERSION }}
            Download the installer from the assets below.
          releaseDraft: false
          prerelease: false

      - name: Update latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"

          # ── DEBUG: show where we are and what exists ──────────────────────
          Write-Output "CWD: $(Get-Location)"
          $bundlePath = Join-Path (Get-Location) "src-tauri/target/release/bundle/nsis"
          Write-Output "Bundle path: $bundlePath"
          Write-Output "Bundle path exists: $(Test-Path $bundlePath)"
          if (Test-Path $bundlePath) {
            Write-Output "=== All files in bundle/nsis ==="
            Get-ChildItem -Path $bundlePath | ForEach-Object { Write-Output "  $($_.Name)" }
            Write-Output "================================="
          } else {
            # Try to find any nsis folder anywhere under target
            Write-Output "=== Searching for nsis folder under src-tauri/target ==="
            Get-ChildItem -Path "src-tauri/target" -Recurse -Directory -Filter "nsis" -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Output "  Found: $($_.FullName)" }
          }
          # ─────────────────────────────────────────────────────────────────

          if (-not (Test-Path $bundlePath)) {
            Write-Warning "Bundle/nsis directory not found at '$bundlePath'. Skipping latest.json update."
            exit 0
          }

          # Find the .sig file (use Where-Object — Win32 -Filter breaks on multiple dots)
          $sigFile = Get-ChildItem -Path $bundlePath |
                     Where-Object { $_.Name -like "*.nsis.zip.sig" } |
                     Select-Object -First 1
          if (-not $sigFile) {
            Write-Warning "No .nsis.zip.sig found — TAURI_SIGNING_PRIVATE_KEY secret is probably not set. Skipping latest.json update."
            exit 0
          }
          Write-Output "Found sig file: $($sigFile.Name)"
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          # Find the .zip file (exclude .sig, use Where-Object for same reason)
          $zipFile = Get-ChildItem -Path $bundlePath |
                     Where-Object { $_.Name -like "*.nsis.zip" -and $_.Name -notlike "*.sig" } |
                     Select-Object -First 1
          $downloadUrl = "https://github.com/Inquiry-Distribution/tauri-master-frontend/releases/download/v${version}/$($zipFile.Name)"

          # Write latest.json
          $json = [ordered]@{
            version  = $version
            notes    = "Bug fixes and improvements"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "latest.json" -Value $json -Encoding UTF8
          Write-Output "latest.json updated to v$version"
          Get-Content "latest.json"

      - name: Commit latest.json back to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          $changes = git diff --staged --name-only
          if ($changes) {
            git commit -m "chore: update latest.json for v${{ steps.version.outputs.VERSION }} [skip ci]"
            git push
            Write-Output "latest.json committed and pushed"
          } else {
            Write-Output "latest.json unchanged, nothing to commit"
          }
