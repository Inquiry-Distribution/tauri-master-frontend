name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'latest.json'
      - '**.md'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: false

      - name: Install frontend dependencies
        run: npm install

      - name: Sync @tauri-apps/api version with Cargo.lock
        shell: pwsh
        run: |
          $lock = Get-Content "src-tauri/Cargo.lock" -Raw
          $match = [regex]::Match($lock, '(?m)^name = "tauri"\r?\nversion = "([^"]+)"')
          if (-not $match.Success) { Write-Error "tauri not found in Cargo.lock"; exit 1 }
          $ver = $match.Groups[1].Value
          Write-Output "Tauri Rust crate: $ver — pinning @tauri-apps/api to same version"
          npm install "@tauri-apps/api@$ver" --save-exact --no-save

      - name: Read version from tauri.conf.json
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "Building version: $v"

      - name: Build & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        with:
          tagName: v${{ steps.version.outputs.VERSION }}
          releaseName: InquiryHub v${{ steps.version.outputs.VERSION }}
          releaseBody: |
            ## InquiryHub v${{ steps.version.outputs.VERSION }}
            Download the installer from the assets below.
          releaseDraft: false
          prerelease: false

      - name: Update latest.json
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          $bundlePath = "src-tauri/target/release/bundle/nsis"

          # Find the .sig file
          $sigFile = Get-ChildItem -Path $bundlePath -Filter "*.nsis.zip.sig" | Select-Object -First 1
          if (-not $sigFile) {
            Write-Error "Signature file not found in $bundlePath"
            exit 1
          }
          $signature = (Get-Content $sigFile.FullName -Raw).Trim()

          # Find the .zip file (exclude .sig)
          $zipFile = Get-ChildItem -Path $bundlePath -Filter "*.nsis.zip" |
                     Where-Object { $_.Extension -ne ".sig" } |
                     Select-Object -First 1
          $downloadUrl = "https://github.com/Inquiry-Distribution/tauri-master-frontend/releases/download/v${version}/$($zipFile.Name)"

          # Write latest.json
          $json = [ordered]@{
            version  = $version
            notes    = "Bug fixes and improvements"
            pub_date = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "latest.json" -Value $json -Encoding UTF8
          Write-Output "latest.json updated to v$version"
          Get-Content "latest.json"

      - name: Commit latest.json back to main
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          $changes = git diff --staged --name-only
          if ($changes) {
            git commit -m "chore: update latest.json for v${{ steps.version.outputs.VERSION }} [skip ci]"
            git push
            Write-Output "latest.json committed and pushed"
          } else {
            Write-Output "latest.json unchanged, nothing to commit"
          }
